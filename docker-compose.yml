services:
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - LIBRARY_DIR=/data/library
      - MEDIA_DIR=/data/media
      - REPOSITORY_DIR=/data/repositories
      - DB_PATH=/data/db/vst.sqlite3
      - BACKUP_DIR=/data/backups
      - LOG_DIR=/data/logs
      - LOG_NAME=api
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SYNAPSE_PUBLIC_ORIGIN=${SYNAPSE_PUBLIC_ORIGIN:-http://localhost:8080}
      - AUTH_BROWSER_WEBDRIVER_URL=http://auth-bridge:4444
      - AUTH_BROWSER_VIEW_URL=http://auth-bridge:7900
      - AUTH_BROWSER_SESSION_MINUTES=${AUTH_BROWSER_SESSION_MINUTES:-30}
      - MEDIA_EGRESS_PROXY_URL=http://auth-egress:8899
    volumes:
      - ./data/library:/data/library
      - ./data/media:/data/media
      - ./data/repositories:/data/repositories
      - ./data/db:/data/db
      - ./data/backups:/data/backups
      - ./data/logs:/data/logs
      - ${HOST_MEDIA_DIR:-./data/media}:/host-media:ro
    depends_on:
      redis:
        condition: service_healthy
      auth-egress:
        condition: service_healthy
    networks:
      - default
      - media-egress
      - auth-control
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Fixed-port bridge is the browser network's only path back toward Synapse.
  # It exposes WebDriver/noVNC to the API but cannot forward arbitrary traffic.
  auth-bridge:
    build: ./backend
    command: python -m app.auth_bridge
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - auth-control
      - auth-browser
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # The renderer is forced through this public-Internet-only proxy. DNS is
  # resolved once here, every answer must be globally routable, and the socket
  # connects to the vetted numeric IP to prevent DNS rebinding.
  auth-egress:
    build: ./backend
    command: python -m app.auth_egress
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      - AUTH_EGRESS_PORT=8899
      - AUTH_EGRESS_CONNECTION_TIMEOUT_SECONDS=${MEDIA_EGRESS_CONNECTION_TIMEOUT_SECONDS:-21600}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    expose:
      - "8899"
    networks:
      - auth-browser
      - media-egress
      - auth-public
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import http.client; c=http.client.HTTPConnection('127.0.0.1',8899,timeout=3); c.request('GET','/.well-known/synapse-auth-egress-health'); r=c.getresponse(); body=r.read(); c.close(); assert r.status == 200 and body == b'ok\n'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Disposable, concurrency-one browser used only when a URL project needs an
  # interactive login. It can see only the filtered proxy and fixed bridge;
  # its profile, X display, and viewer connections are discarded after one
  # session by restarting the container.
  auth-browser:
    image: selenium/standalone-chromium:149.0-20260606@sha256:9b10a9ccf68e3a18153a68a0705577157e20665d88d00bd4393a42e5839aa3d3
    shm_size: 2gb
    environment:
      - SE_NODE_MAX_SESSIONS=1
      - SE_NODE_SESSION_TIMEOUT=${AUTH_BROWSER_SESSION_SECONDS:-1800}
      - SE_SESSION_REQUEST_TIMEOUT=5
      - SE_DRAIN_AFTER_SESSION_COUNT=1
      - SE_VNC_NO_PASSWORD=true
      - SE_SCREEN_WIDTH=1440
      - SE_SCREEN_HEIGHT=900
      - SE_SCREEN_DEPTH=24
    expose:
      - "4444"
      - "7900"
    networks:
      - auth-browser
    depends_on:
      auth-egress:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    # concurrency 4: run-all's orchestrator occupies one slot while the
    # parallel branches (e.g. both deep dives) run in the others
    command: celery -A app.tasks.celery_app.celery worker --loglevel=info --concurrency=4
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - LIBRARY_DIR=/data/library
      - MEDIA_DIR=/data/media
      - REPOSITORY_DIR=/data/repositories
      - DB_PATH=/data/db/vst.sqlite3
      - BACKUP_DIR=/data/backups
      - LOG_DIR=/data/logs
      - LOG_NAME=worker
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MEDIA_EGRESS_PROXY_URL=http://auth-egress:8899
    volumes:
      - ./data/library:/data/library
      - ./data/media:/data/media
      - ./data/repositories:/data/repositories
      - ./data/db:/data/db
      - ./data/backups:/data/backups
      - ./data/logs:/data/logs
      - whisper-models:/root/.cache/huggingface
      - ${HOST_MEDIA_DIR:-./data/media}:/host-media:ro
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      auth-egress:
        condition: service_healthy
    networks:
      - default
      - media-egress
    restart: unless-stopped

  paper-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.paper
    # PDF parsing is deliberately isolated and serialized: Docling's layout,
    # table, formula, and OCR stages are CPU/RAM intensive, while downstream
    # map/reduce and audience generation remain on the ordinary worker.
    command: >-
      celery -A app.tasks.celery_app.celery worker --loglevel=info
      --concurrency=1 -Q paper
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LIBRARY_DIR=/data/library
      - MEDIA_DIR=/data/media
      - REPOSITORY_DIR=/data/repositories
      - DB_PATH=/data/db/vst.sqlite3
      - BACKUP_DIR=/data/backups
      - LOG_DIR=/data/logs
      - LOG_NAME=paper-worker
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SYNAPSE_PAPER_WORKER=1
      - DOCLING_ARTIFACTS_PATH=/opt/docling/models
      - DOCLING_DEVICE=cpu
      - DOCLING_NUM_THREADS=${PAPER_WORKER_THREADS:-4}
      - OMP_NUM_THREADS=${PAPER_WORKER_THREADS:-4}
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - ./data/library:/data/library
      - ./data/media:/data/media
      - ./data/repositories:/data/repositories
      - ./data/db:/data/db
      - ./data/backups:/data/backups
      - ./data/logs:/data/logs
      - ${HOST_MEDIA_DIR:-./data/media}:/host-media:ro
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 10m
    restart: unless-stopped

  beat:
    build: ./backend
    command: >-
      celery -A app.tasks.celery_app.celery beat --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - LIBRARY_DIR=/data/library
      - MEDIA_DIR=/data/media
      - DB_PATH=/data/db/vst.sqlite3
      - BACKUP_DIR=/data/backups
      - LOG_DIR=/data/logs
      - LOG_NAME=beat
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data/library:/data/library
      - ./data/media:/data/media
      - ./data/db:/data/db
      - ./data/backups:/data/backups
      - ./data/logs:/data/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    # persist the broker/result backend so a stack restart doesn't silently
    # drop queued jobs (leaving their Job rows stuck 'queued'/'running' forever)
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest@sha256:509fdf54e23bd50d87af646cb51c0a7a203d6a83cc4d6695b3b08c5be1c62c0a
    environment:
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-65536}
      # Repository-local is a hard data boundary; never permit Ollama's
      # transparent cloud-model offload through the loopback daemon.
      - OLLAMA_NO_CLOUD=1
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      - SYNAPSE_PUBLIC_ORIGIN=${SYNAPSE_PUBLIC_ORIGIN:-http://localhost:8080}
      # Substitute only the trusted value, preserving nginx's own $variables.
      - NGINX_ENVSUBST_FILTER=SYNAPSE_PUBLIC_ORIGIN
    ports:
      # Synapse has no authentication. Keep the default stack local-only;
      # setting SYNAPSE_BIND_ADDRESS=0.0.0.0 is an explicit LAN opt-in.
      - "${SYNAPSE_BIND_ADDRESS:-127.0.0.1}:8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  ollama-models:
  whisper-models:
  redis-data:

networks:
  auth-control:
    internal: true
  auth-browser:
    internal: true
  media-egress:
    internal: true
  auth-public:
